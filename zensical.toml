# Curated navigation, ordered by the Diátaxis quadrants (tutorial → how-to →
# explanation → reference). Without this, the sidebar auto-generates
# alphabetically; the order below is pedagogical.
nav = [
  { Home = "index.md" },
  { Tutorial = [ { "Getting started" = "getting-started.md" } ] },
  { "How-to guides" = [
    { "Load & merge configuration" = "how-to/load-and-merge.md" },
    { "Use typed sections" = "how-to/typed-sections.md" },
    { "React to changes with hot-reload" = "how-to/hot-reload.md" },
    { "Validate configuration" = "how-to/validate-config.md" },
    { "Bind CLI flags" = "how-to/bind-cli-flags.md" },
    { "Test with the config mock" = "how-to/test-with-mocks.md" },
  ] },
  { Explanation = [
    { "Why a wrapper over Viper" = "explanation/why-a-wrapper.md" },
    { "Precedence & merge model" = "explanation/precedence-and-merge.md" },
    { "Hot-reload safety" = "explanation/hot-reload-safety.md" },
  ] },
  { "Reference (pkg.go.dev)" = "https://pkg.go.dev/gitlab.com/phpboyscout/go/config" },
]

[project]
site_name = "config"
site_description = "A hardened Viper configuration container for Go — hierarchical merge, safe hot-reload, typed sections, and struct-tag validation, behind one small interface"
site_author = "Matt Cockayne"
site_url = "https://config.go.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/go/config"
repo_name = "phpboyscout/go/config"
copyright = "Copyright &copy; 2026 Matt Cockayne"

[project.theme]
logo = "images/branding/logo_transparent.svg"
favicon = "images/branding/favicon.svg"
language = "en"
features = [
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/gitlab"
link = "https://gitlab.com/phpboyscout/go/config"

